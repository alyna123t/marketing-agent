# The marketing agent's scheduled runtime (see agents/marketing-agent/AGENT.md).
# Draft-only by construction: this workflow has no posting credentials to any surface.
# Setup: add ANTHROPIC_API_KEY as a repo secret, then smoke-test via workflow_dispatch.

name: marketing-agent
on:
  schedule:
    - cron: "0 9 * * 1" # Mon 09:00 UTC — weekly shiplog + tweet digest
  workflow_dispatch: # manual runs (smoke tests, feature-built deep-dives)
    inputs:
      task:
        description: "Override task (default: weekly loop). E.g. 'feature-built for intake/features/412-headline-gate.md'"
        required: false
        default: ""

jobs:
  weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-sonnet-5"
          prompt: |
            You are Simmer's marketing agent. Read agents/marketing-agent/AGENT.md
            and follow it.

            ${{ github.event.inputs.task || 'Run the weekly loop for the current ISO week (compute it from today''s date): format-weekly-shiplog, then format-tweet-digest, each per its SKILL.md in skills/marketing/.' }}

            Rules that override everything else:
            - Read ships and tweets ONLY from shared-knowledge/marketing/intake/.
              A missing intake file means: write a blocked note to
              drafts/community-feed/ and stop that format. Never fetch a substitute.
            - Write full-schema drafts to drafts/community-feed/. Draft-only:
              never post anywhere.
            - A gate failure ("no post") is a normal outcome — log it and stop.

      - name: Commit drafts
        run: |
          git config user.name "marketing-agent"
          git config user.email "marketing-agent[bot]@users.noreply.github.com"
          git add drafts/
          git diff --cached --quiet || git commit -m "agent: drafts for $(date +%G-W%V)"
          git push
